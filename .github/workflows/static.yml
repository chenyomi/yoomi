name: Deploy Vue 3 + Vite + Vuetify to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ 拉取仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 安装 Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: yarn install

      # 4️⃣ 构建项目
      - name: Build project
        run: yarn build

      # 5️⃣ 创建 .nojekyll 避免 GitHub Pages 解析错误
      - name: Create .nojekyll
        run: touch docs/.nojekyll

      # 6️⃣ 如果使用 history 模式，还需要 404.html 处理
      - name: Copy index.html to 404.html (history fallback)
        run: cp docs/index.html docs/404.html

      # 7️⃣ 上传 dist 目录到 GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
